data_root: data/coco_minitrain_25k/raw/coco_minitrain_25k/
device: cpu  # cuda | mps | cpu

batch_size: 64
epochs: 135
lr: 1e-4
momentum: 0.9  # AdamW beta1
weight_decay: 0.0005
num_workers: 2  # data loader worker processes, match the CPU count (nproc)
fused_adam: false  # use fused AdamW if available, otherwise use torch.optim.AdamW

ckpt_dir: checkpoints/yolov0/coco_minitrain_25k
resume: false  # true = continue from the latest ckpt_dir/epoch_*.pt
