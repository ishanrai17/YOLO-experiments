data_root: data/coco128/raw/coco128/
device: cpu  # cuda | mps | cpu

batch_size: 8
epochs: 5
lr: 1e-4
num_workers: 2  # data loader worker processes, match the CPU count (nproc)
fused_adam: false  # use fused AdamW if available, otherwise use torch.optim.AdamW
max_grad_norm: 1.0  # clip the global gradient norm to this before each optimizer step

ckpt_dir: checkpoints/yolov0/coco128
resume: false  # true = continue from ckpt_dir/last_epoch.pt
